# Modular RAG MCP Server - Configuration
# Auto-generated by setup skill. Edit as needed.

# ⚠️ 安全提醒：不要在此文件提交真实 API Key！
# 请在 .env 文件中设置环境变量，优先级高于此文件。
# 此文件中的占位符在运行时会被环境变量覆盖。

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "openai"
  model: "gpt-4o"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  # 请设置环境变量 OPENAI_API_KEY，或在此填写（勿提交到 Git）
  api_key: "__OPENAI_API_KEY__"
  base_url: "https://api.openai-proxy.org/v1"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1536
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: "__OPENAI_API_KEY__"
  base_url: "https://api.openai-proxy.org/v1"

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: true
  provider: "openai"
  model: "gpt-4o"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: "__OPENAI_API_KEY__"
  base_url: "https://api.openai-proxy.org/v1"
  max_image_size: 2048

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "default"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

# =============================================================================
# Reranker Configuration
# =============================================================================
rerank:
  enabled: false
  provider: "none"
  model: "none"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "none"
  metrics:
    - "faithfulness"
    - "relevancy"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/trace.json"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 50
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false

# =============================================================================
# Web Search Configuration
# =============================================================================
web_search:
  engine: "tavily"
  tavily_api_key: ""
  google_api_key: ""
  google_search_engine_id: ""
  bing_api_key: ""

# =============================================================================
# Agent Configuration
# =============================================================================
agent:
  enabled: true
  max_iterations: 5
  enable_logging: true
  memory_max_turns: 10
  memory_max_tokens: 2000

# =============================================================================
# Server Configuration
# =============================================================================
server:
  host: "0.0.0.0"
  port: 3000
  debug: false
  log_level: "INFO"

# =============================================================================
# Security Configuration
# =============================================================================
security:
  secret_key: "your-secret-key-change-this"
  access_token_expire_minutes: 30
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"

# =============================================================================
# Finance Agent Configuration
# =============================================================================
finance:
  market_data:
    a_share:
      providers:
        primary: "tushare"
        fallback: "akshare"
      enabled: true
    us_hk:
      provider: "yfinance"
      enabled: true
  analysis_modes:
    quick:
      description: "快速分析 — 仅行情+基础指标，60秒内完成"
      agents: ["finance_data", "business_compute"]
      tasks: ["quote", "fundamentals", "calculate_metrics"]
      enable_rag: false
      enable_charts: false
      enable_critique: false
      enable_conflict_detect: false
    standard:
      description: "标准研报 — 文档+行情+计算+图表，3-5分钟"
      agents: ["rag", "finance_data", "business_compute", "generate"]
      tasks: ["document_search", "quote", "fundamentals", "calculate_metrics", "compare", "visualize", "generate_report"]
      enable_rag: true
      enable_charts: true
      enable_critique: false
      enable_conflict_detect: true
    deep:
      description: "深度研报 — 全链路+DCF估值+VLM评审+冲突检测，8-15分钟"
      agents: ["rag", "finance_data", "business_compute", "generate"]
      tasks: ["document_search", "quote", "fundamentals", "history", "calculate_metrics", "compare", "valuation", "visualize", "generate_report"]
      enable_rag: true
      enable_charts: true
      enable_critique: true
      enable_conflict_detect: true
      enable_dcf: true
      enable_chain_of_analysis: true
  computation:
    visualization:
      output_dir: "data/charts"
      default_format: "png"
      default_dpi: 150
      enable_critique: false
      max_chart_iterations: 3
    report:
      template_dir: "templates/finance"
      output_dir: "data/reports"
