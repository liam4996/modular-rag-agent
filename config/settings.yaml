# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "default"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

# =============================================================================
# Reranker Configuration
# =============================================================================
rerank:
  enabled: false
  provider: "none"
  model: "none"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "none"
  metrics:
    - "faithfulness"
    - "relevancy"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/trace.json"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 50
  chunk_refiner:
    use_llm: false
  metadata_enricher:
    use_llm: false

# =============================================================================
# Web Search Configuration (Tavily recommended for China)
# =============================================================================
web_search:
  engine: "tavily"
  tavily_api_key: ""

# =============================================================================
# Agent Configuration
# =============================================================================
agent:
  enabled: true
  max_iterations: 5
  enable_logging: true
  memory_max_turns: 10
  memory_max_tokens: 2000

# =============================================================================
# Server Configuration
# =============================================================================
server:
  host: "0.0.0.0"
  port: 3000
  debug: false
  log_level: "INFO"

# =============================================================================
# Security Configuration
# =============================================================================
security:
  secret_key: "your-secret-key-change-this"
  access_token_expire_minutes: 30
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"

# =============================================================================
# Finance Agent Configuration (NEW — Phase 1)
# =============================================================================
finance:
  market_data:
    a_share:
      provider: "akshare"
      enabled: true
    us_hk:
      provider: "yfinance"
      enabled: true
  computation:
    visualization:
      output_dir: "data/charts"
      default_format: "png"
      default_dpi: 150
    report:
      template_dir: "templates/finance"
      output_dir: "data/reports"
